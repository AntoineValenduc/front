name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build_docker_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: install checkout
        uses: actions/checkout@v7

      - name: check version docker
        run: |
          docker -v
          docker compose version

      - name: docker up
        run: docker compose up -d

      - name: install dependencies
        run: docker compose exec -T -w /front node npm ci

#      - name: run test
#        run: docker compose exec -T -w /front node npm test -- --ci --passWithNoTests

      - name: build app
        run: docker compose exec -T -w /front node npm run build

      - name: docker compose down
        if: always()
        run: docker compose down

  check_image_docker:
    needs: build_docker_and_test
    runs-on: ubuntu-latest

    steps:

      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Docker scout
      #   uses: docker/scout-action@v1
      #   with:
      #     command: cves, recommendations, compare
      #     image: postgres:18-alpine3.24
      #     to: postgres:latest
      #     ignore-unchanged: true
      #     only-unfixed: true

      - name: trivy - scan image
        uses: aquasecurity/trivy-action@v0.3.1
        with:
          image-ref: postgres:18-alpine3.24
          format: table
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH

  renovate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Action Renovate
        uses: renovatebot/github-action@v43
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
      